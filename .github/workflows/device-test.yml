name: Device test

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          python3 tools/build_app_html.py source/preview.html app/src/main/assets/index.html
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SketchDraw.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run every lesson on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tools/device_test.sh SketchDraw.apk shots

      - name: Shrink screenshots
        if: always()
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null || true
          cd shots && for f in *.png; do convert "$f" -resize 50% -quality 80 "${f%.png}.jpg" && rm "$f"; done; ls | wc -l

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-shots
          path: shots
