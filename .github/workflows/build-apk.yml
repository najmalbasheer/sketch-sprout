name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the app page from the lesson source
        run: python3 tools/build_app_html.py source/preview.html app/src/main/assets/index.html

      - name: Build the APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SketchSprout.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SketchSprout-apk
          path: SketchSprout.apk

      - name: Publish a download on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sketch Sprout 1.0.${{ github.run_number }}
          body: Download SketchSprout.apk on the Android phone or tablet and open it to install.
          files: SketchSprout.apk
          make_latest: true
